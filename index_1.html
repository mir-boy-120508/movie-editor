<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web動画編集</title>
<link rel="stylesheet" href="css/style.css">
<script src="coi-serviceworker.js"></script>
</head>
<body>

<header class="app-header">
  <div class="logo">Web動画編集</div>
  <div class="header-actions">
    <label class="btn btn-secondary" for="file-input">
      動画を追加(4K対応)
      <input type="file" id="file-input" accept="video/*" multiple hidden>
    </label>
    <label class="btn btn-secondary" for="bgm-input">
      BGMを追加
      <input type="file" id="bgm-input" accept="audio/*" hidden>
    </label>
    <button class="btn btn-primary" id="export-btn">書き出す(FHD)</button>
  </div>
</header>

<main class="app-main">

  <section class="preview-panel">
    <div class="preview-stage">
      <video id="preview-video" muted playsinline></video>
      <canvas id="preview-canvas"></canvas>
      <div id="drop-hint" class="drop-hint">
        <p>ここに動画ファイルをドラッグ&ドロップ</p>
        <p class="drop-hint-sub">または上の「動画を追加」ボタンから選択</p>
      </div>
    </div>
    <div class="preview-controls">
      <button id="play-btn" class="btn btn-icon" aria-label="再生">▶</button>
      <span id="time-display" class="time-display">00:00.0 / 00:00.0</span>
      <input type="range" id="seek-bar" min="0" max="1000" value="0" step="1">
    </div>
  </section>

  <aside class="telop-panel">
    <h2>テロップ</h2>
    <button id="add-telop-btn" class="btn btn-secondary btn-block">+ テロップを追加</button>
    <div id="telop-list" class="telop-list"></div>
    <div id="telop-editor" class="telop-editor hidden">
      <h3>テロップ編集</h3>
      <label>テキスト
        <textarea id="telop-text" rows="2"></textarea>
      </label>
      <label>開始(秒)
        <input type="number" id="telop-start" min="0" step="0.1">
      </label>
      <label>終了(秒)
        <input type="number" id="telop-end" min="0" step="0.1">
      </label>
      <label>位置
        <select id="telop-position">
          <option value="top">上</option>
          <option value="center" selected>中央</option>
          <option value="bottom">下</option>
        </select>
      </label>
      <label>色
        <input type="color" id="telop-color" value="#ffffff">
      </label>
      <label>文字サイズ
        <input type="range" id="telop-size" min="16" max="120" value="48">
      </label>
      <button id="telop-delete-btn" class="btn btn-danger btn-block">このテロップを削除</button>
    </div>
  </aside>

  <section class="timeline-panel">
    <div class="timeline-toolbar">
      <button id="split-btn" class="btn btn-icon" title="再生位置でカット">✂ カット</button>
      <button id="delete-clip-btn" class="btn btn-icon" title="選択中のクリップを削除">🗑 削除</button>
      <div class="zoom-control">
        <span>拡大</span>
        <input type="range" id="zoom-slider" min="20" max="200" value="60">
      </div>
    </div>
    <div class="timeline-scroll" id="timeline-scroll">
      <div class="timeline-ruler" id="timeline-ruler"></div>
      <div class="timeline-playhead" id="timeline-playhead"></div>
      <div class="track-row">
        <div class="track-label">映像</div>
        <div class="track-lane" id="video-track"></div>
      </div>
      <div class="track-row">
        <div class="track-label">テロップ</div>
        <div class="track-lane" id="telop-track"></div>
      </div>
      <div class="track-row">
        <div class="track-label">BGM</div>
        <div class="track-lane" id="bgm-track"></div>
      </div>
    </div>
  </section>

</main>

<div id="export-modal" class="modal hidden">
  <div class="modal-box">
    <h2>書き出し中…</h2>
    <p id="export-status">準備しています</p>
    <div class="progress-bar"><div id="export-progress" class="progress-fill"></div></div>
    <a id="export-download" class="btn btn-primary hidden" download="output.mp4">動画をダウンロード</a>
    <button id="export-close" class="btn btn-secondary">閉じる</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
